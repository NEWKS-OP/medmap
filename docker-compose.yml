services:
  backend:
    build: ./medmap
    ports:
      - "8000:8000"
    volumes:
      - ./medmap/data:/app/data
    env_file:
      - path: ./medmap/.env
        required: false

  frontend:
    build:
      context: ./frontend
      args:
        # Called from the browser, so it must be reachable from the host, not "backend".
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
